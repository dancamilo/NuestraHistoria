<!-- ============== CARRUSEL ============== -->
<section id="momentos" class="section section-beige-dark">

  <div class="section-inner">

    <h2>Nuestros momentos</h2>

    <div class="carousel" id="carousel">

      <div
        class="carousel-track"
        id="carouselTrack"
      ></div>

      <button
        class="carousel-arrow carousel-prev"
        id="carouselPrev"
        aria-label="Anterior"
      >
        ‹
      </button>

      <button
        class="carousel-arrow carousel-next"
        id="carouselNext"
        aria-label="Siguiente"
      >
        ›
      </button>

      <div
        class="carousel-dots"
        id="carouselDots"
      ></div>

    </div>

  </div>

</section>
